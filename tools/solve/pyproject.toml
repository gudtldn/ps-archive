[project]
name = "solve"
version = "0.1.0"
description = "ps-archive CLI: solved.ac metadata, BOJ samples, and a language-agnostic test runner"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "typer>=0.24",
]

[project.scripts]
solve = "solve.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solve"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
